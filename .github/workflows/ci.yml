name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: typecheck + build + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify the packaged artifact
        run: |
          npm pack --dry-run
          node dist/cli.js --help > /dev/null
          node -e "import('./dist/index.js').then(m => { if (!m.GoogleAccountConnectorPlugin || !m.default) process.exit(1); })"
