name: Publish to npm

# Manual, maintainer-triggered. Configure npm trusted publishing (OIDC) for
# this repository, or provide an NPM_TOKEN secret as a fallback.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag"
        default: "latest"
        required: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm publish --provenance --access public --tag "${{ inputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
